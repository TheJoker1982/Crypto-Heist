<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Events - CRYPTO HEIST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="/public/crypto-heist-unified.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .event-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 0, 102, 0.1));
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s ease;
        }
        
        .event-card:hover {
            transform: scale(1.02);
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .countdown {
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #ffd700, #ff0066);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .leaderboard-row {
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid #00ff88;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .leaderboard-row:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: translateX(5px);
        }
        
        .leaderboard-row.top-3 {
            border-left-color: #ffd700;
        }
        
        .event-chat-container {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .event-message {
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid #00ffff;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="grid-overlay"></div>
    
    <div class="main-container">
        <header class="hud-header">
            <div class="container mx-auto px-6 py-4">
                <div class="flex justify-between items-center">
                    <div class="logo">CRYPTO HEIST</div>
                    <nav class="flex items-center gap-6">
                        <a href="/" class="nav-link">Dashboard</a>
                        <a href="/progression" class="nav-link">Progression</a>
                        <a href="/squad" class="nav-link">Squads</a>
                        <a href="/friends" class="nav-link">Friends</a>
                        <a href="/events" class="nav-link" style="color: #ff00ff;">Events</a>
                        <a href="/notifications" class="nav-link">Notifications</a>
                        <div id="user-section">
                            <button onclick="login()" class="cyber-btn">Login</button>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-6 py-8">
            <div class="mb-8">
                <h1 class="text-5xl font-bold mb-2 text-center" style="color: #ffd700;">🏆 GLOBAL EVENTS</h1>
                <p class="text-center text-gray-400">Compete against the world for epic prizes</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div id="active-events" class="space-y-6"></div>
            </div>

            <div id="event-details" style="display: none;" class="panel mb-8">
                <button onclick="closeEventDetails()" class="cyber-btn-outline mb-4">← Back to Events</button>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2">
                        <div id="event-info" class="mb-6"></div>
                        <div class="panel">
                            <h2 class="text-2xl font-bold mb-4" style="color: #ffd700;">🏆 Live Leaderboard</h2>
                            <div id="event-leaderboard"></div>
                        </div>
                    </div>
                    <div>
                        <div class="event-chat-container">
                            <div class="p-4 border-b border-gray-700">
                                <h3 class="font-bold" style="color: #00ffff;">Event Chat</h3>
                            </div>
                            <div class="chat-messages" id="event-chat-messages"></div>
                            <div class="p-4 border-t border-gray-700">
                                <input type="text" id="event-chat-input" class="input-field w-full" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendEventMessage()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2 class="text-2xl font-bold mb-4" style="color: #00ffff;">Past Events & Winners</h2>
                <div id="past-events" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let eventChatSocket = null;
        let currentEventId = null;
        let leaderboardInterval = null;
        
        async function checkAuth() {
            try {
                const response = await fetch('/api/user/profile');
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('user-section').innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-gray-300">Welcome, ${currentUser.username}</span>
                            <button onclick="logout()" class="cyber-btn-outline">Logout</button>
                        </div>
                    `;
                    connectEventChatSocket();
                    loadEvents();
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }
        
        function connectEventChatSocket() {
            if (!currentUser) return;
            
            eventChatSocket = io('/event-chat');
            
            eventChatSocket.on('connect', () => {
                console.log('🏆 Connected to event chat');
                eventChatSocket.emit('join', {
                    userId: currentUser.id,
                    username: currentUser.username
                });
            });
            
            eventChatSocket.on('message', (message) => {
                displayEventMessage(message);
            });
            
            eventChatSocket.on('leaderboard-update', (leaderboard) => {
                if (currentEventId) {
                    displayLeaderboard(leaderboard);
                }
            });
        }
        
        async function loadEvents() {
            try {
                const [activeRes, pastRes] = await Promise.all([
                    fetch('/api/events'),
                    fetch('/api/events/past')
                ]);
                
                const activeData = await activeRes.json();
                const pastData = await pastRes.json();
                
                displayActiveEvents(activeData.events);
                displayPastEvents(pastData.events);
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }
        
        function displayActiveEvents(events) {
            const container = document.getElementById('active-events');
            
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="event-card col-span-2">
                        <div class="text-center py-8">
                            <p class="text-xl" style="color: #ffd700;">📅 No active events right now</p>
                            <p class="text-gray-400 mt-2">Check back soon for new competitions!</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = events.map(event => {
                const startTime = new Date(event.start_time);
                const endTime = new Date(event.end_time);
                const now = new Date();
                const isActive = now >= startTime && now <= endTime;
                
                const timeLeft = endTime - now;
                const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                
                return `
                    <div class="event-card">
                        <div class="mb-4">
                            <h2 class="text-3xl font-bold mb-2" style="color: #ffd700;">${event.name}</h2>
                            <p class="text-gray-300">${event.description}</p>
                        </div>
                        
                        <div class="mb-4">
                            <p class="text-sm text-gray-400 mb-2">Prize Pool:</p>
                            <div class="flex items-center gap-4">
                                <p class="text-2xl font-bold" style="color: #F7931A;">${event.prize_pool_btc || 0} BTC</p>
                                ${event.prize_pool_currency ? `<p class="text-xl" style="color: #00ff88;">+${event.prize_pool_currency} Credits</p>` : ''}
                            </div>
                        </div>
                        
                        ${isActive ? `
                            <div class="mb-4">
                                <p class="text-sm text-gray-400 mb-2">Time Remaining:</p>
                                <p class="countdown">${hours}h ${minutes}m</p>
                            </div>
                        ` : `
                            <div class="mb-4">
                                <p class="text-sm text-gray-400">Starts: ${startTime.toLocaleString()}</p>
                            </div>
                        `}
                        
                        <button onclick="viewEvent(${event.id})" class="cyber-btn w-full">
                            ${isActive ? 'Join & Compete' : 'View Details'}
                        </button>
                    </div>
                `;
            }).join('');
        }
        
        function displayPastEvents(events) {
            const container = document.getElementById('past-events');
            
            if (events.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-8">No past events to display</p>';
                return;
            }
            
            container.innerHTML = events.map(event => `
                <div class="mission-card">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="font-bold text-xl mb-2" style="color: #00ffff;">${event.name}</h3>
                            <p class="text-sm text-gray-400">Ended: ${new Date(event.end_time).toLocaleString()}</p>
                        </div>
                        <button onclick="viewEvent(${event.id})" class="cyber-btn-outline text-sm px-4 py-2">View Results</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function viewEvent(eventId) {
            currentEventId = eventId;
            document.getElementById('active-events').parentElement.style.display = 'none';
            document.getElementById('event-details').style.display = 'block';
            
            if (eventChatSocket) {
                eventChatSocket.emit('join-event', eventId);
            }
            
            loadEventDetails(eventId);
            loadEventLeaderboard(eventId);
            loadEventChat(eventId);
            
            leaderboardInterval = setInterval(() => {
                loadEventLeaderboard(eventId);
            }, 5000);
        }
        
        function closeEventDetails() {
            if (leaderboardInterval) {
                clearInterval(leaderboardInterval);
            }
            
            if (eventChatSocket && currentEventId) {
                eventChatSocket.emit('leave-event', currentEventId);
            }
            
            currentEventId = null;
            document.getElementById('active-events').parentElement.style.display = 'grid';
            document.getElementById('event-details').style.display = 'none';
        }
        
        async function loadEventLeaderboard(eventId) {
            try {
                const response = await fetch(`/api/events/${eventId}/leaderboard`);
                if (!response.ok) throw new Error('Failed to fetch leaderboard');
                
                const data = await response.json();
                displayLeaderboard(data.leaderboard);
            } catch (error) {
                console.error('Error loading leaderboard:', error);
            }
        }
        
        function displayLeaderboard(leaderboard) {
            const container = document.getElementById('event-leaderboard');
            
            if (leaderboard.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-8">No participants yet</p>';
                return;
            }
            
            container.innerHTML = leaderboard.map(entry => {
                const rankEmoji = entry.rank === 1 ? '🥇' : entry.rank === 2 ? '🥈' : entry.rank === 3 ? '🥉' : `#${entry.rank}`;
                const topClass = entry.rank <= 3 ? 'top-3' : '';
                
                return `
                    <div class="leaderboard-row ${topClass}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">${rankEmoji}</span>
                                <img src="${entry.profile_image_url || '/default-avatar.png'}" class="w-10 h-10 rounded-full" onerror="this.src='/default-avatar.png'">
                                <div>
                                    <p class="font-bold">${entry.username}</p>
                                    <p class="text-sm text-gray-400">Level ${entry.level || 1}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-2xl font-bold" style="color: #00ff88;">${entry.score}</p>
                                <p class="text-xs text-gray-400">points</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function loadEventChat(eventId) {
            try {
                const response = await fetch(`/api/events/${eventId}/messages`);
                if (!response.ok) throw new Error('Failed to fetch chat');
                
                const data = await response.json();
                data.messages.forEach(msg => displayEventMessage(msg));
            } catch (error) {
                console.error('Error loading chat:', error);
            }
        }
        
        function displayEventMessage(message) {
            const container = document.getElementById('event-chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'event-message';
            msgDiv.innerHTML = `
                <p class="font-bold text-sm">${message.sender_name}</p>
                <p class="text-sm text-gray-300">${message.content}</p>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function sendEventMessage() {
            const input = document.getElementById('event-chat-input');
            const content = input.value.trim();
            
            if (!content || !eventChatSocket || !currentEventId) return;
            
            eventChatSocket.emit('message', {
                eventId: currentEventId,
                content: content
            });
            
            input.value = '';
        }
        
        function loadEventDetails() {}
        
        function login() {
            window.location.href = '/api/auth/login';
        }
        
        function logout() {
            window.location.href = '/api/auth/logout';
        }
        
        checkAuth();
    </script>
</body>
</html>
